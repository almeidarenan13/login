<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MetaQuest - Home</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #ffffff;
}

/* TOPO */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
}

/* LOGO */
.logo {
    background: #5b74ff;
    color: #fff;
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: bold;
}

/* DIREITA */
.right {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* BARRA */
.progress {
    width: 140px;
    height: 10px;
    background: #e0e0e0;
    border-radius: 20px;
    overflow: hidden;
}

.progress span {
    display: block;
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #001aff, #00aaff);
    transition: width 0.3s;
}

/* SALDO */
.balance {
    background: #001aff;
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: bold;
}

/* CONTEÚDO */
.container {
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    gap: 35px;
}

/* CAIXAS */
.box {
    width: 100%;
    height: 170px;
    border: 2px solid #222;
    border-radius: 25px;
    cursor: pointer;
    transition: transform 0.2s;
}

.box:active {
    transform: scale(0.98);
}
</style>
</head>

<body>

<!-- TOPO -->
<div class="topbar">
    <div class="logo">META</div>

    <div class="right">
        <div class="progress">
            <span id="progressBar"></span>
        </div>
        <div class="balance">$ <span id="saldo">0</span></div>
    </div>
</div>

<!-- CAIXAS -->
<div class="container">
    <div class="box" onclick="ganharSaldo()"></div>
    <div class="box" onclick="ganharSaldo()"></div>
</div>

<script>
let saldo = localStorage.getItem("saldo")
    ? parseInt(localStorage.getItem("saldo"))
    : 0;

const saldoEl = document.getElementById("saldo");
const progressBar = document.getElementById("progressBar");

function atualizarTela() {
    saldoEl.innerText = saldo;

    // cada $1 = 10% da barra (máx 100%)
    let progresso = Math.min(saldo * 10, 100);
    progressBar.style.width = progresso + "%";
}

function ganharSaldo() {
    saldo += 1;
    localStorage.setItem("saldo", saldo);
    atualizarTela();
}

// carregar saldo ao abrir
atualizarTela();
</script>

</body>
</html>
