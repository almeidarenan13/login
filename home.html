<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MetaQuest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
        }

        /* TOPO */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            background: #4b5cff;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .right-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress {
            width: 120px;
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4b5cff, #00c6ff);
            transition: width 0.3s;
        }

        .balance {
            background: #4b5cff;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* CONTEÚDO */
        .content {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .box {
            width: 280px;
            height: 160px;
            border: 3px solid #333;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- TOPO -->
    <div class="top-bar">
        <div class="logo">META</div>

        <div class="right-top">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="balance">
                $ <span id="saldo">0</span>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO -->
    <div class="content">
        <div class="box" onclick="ganharSaldo()"></div>
        <div class="box" onclick="ganharSaldo()"></div>
    </div>

    <script>
        let saldo = 0;
        let progresso = 0;

        function ganharSaldo() {
            saldo += 1;
            progresso += 10;

            if (progresso > 100) {
                progresso = 100;
            }

            document.getElementById("saldo").innerText = saldo;
            document.getElementById("progressBar").style.width = progresso + "%";
        }
    </script>

</body>
</html>
