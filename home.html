<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MetaQuest - Home</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #ffffff;
}

/* TOPO */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
}

/* LOGO META */
.logo {
    background: #5b74ff;
    color: #fff;
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
}

/* LADO DIREITO */
.right {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* BARRA */
.progress {
    width: 140px;
    height: 10px;
    background: #e0e0e0;
    border-radius: 20px;
    overflow: hidden;
}

.progress span {
    display: block;
    width: 55%;
    height: 100%;
    background: linear-gradient(90deg, #001aff, #00aaff);
}

/* SALDO */
.balance {
    background: #001aff;
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
}

/* CONTEÚDO */
.container {
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    gap: 35px;
}

/* CAIXAS */
.box {
    width: 100%;
    height: 170px;
    border: 2px solid #222;
    border-radius: 25px;
}
</style>
</head>

<body>

<!-- TOPO -->
<div class="topbar">
    <div class="logo">META</div>

    <div class="right">
        <div class="progress">
            <span></span>
        </div>
        <div class="balance">$ 0</div>
    </div>
</div>

<!-- CAIXAS -->
<div class="container">
    <div class="box"></div>
    <div class="box"></div>
</div>

</body>
</html>
