<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MetaQuest | Vídeos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f2f5;
        }

        header {
            background: #4b5cff;
            color: #fff;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header img {
            width: 40px;
        }

        header button {
            background: #fff;
            color: #4b5cff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .feed {
            max-width: 420px;
            margin: 20px auto;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        video {
            width: 100%;
            height: 500px;
            object-fit: cover;
            background: #000;
        }

        .actions {
            display: none;
            justify-content: space-around;
            padding: 12px;
        }

        .actions button {
            width: 45%;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        .like {
            background: #4b5cff;
            color: #fff;
        }

        .dislike {
            background: #e4e6eb;
        }
    </style>
</head>

<body>

<header>
    <img src="logo.png" alt="MetaQuest">
    <button onclick="logout()">Sair</button>
</header>

<div class="feed">

    <!-- VIDEO 1 -->
    <div class="card">
        <video src="video1.mp4" controls onended="showActions(this)"></video>
        <div class="actions">
            <button class="like" onclick="like(this)">Curtir 👍</button>
            <button class="dislike" onclick="dislike(this)">Não curtir 👎</button>
        </div>
    </div>

    <!-- VIDEO 2 -->
    <div class="card">
        <video src="video2.mp4" controls onended="showActions(this)"></video>
        <div class="actions">
            <button class="like" onclick="like(this)">Curtir 👍</button>
            <button class="dislike" onclick="dislike(this)">Não curtir 👎</button>
        </div>
    </div>

</div>

<script>
    // PROTEÇÃO DE LOGIN
    if (!localStorage.getItem("logado")) {
        window.location.href = "index.html";
    }

    function logout() {
        localStorage.removeItem("logado");
        window.location.href = "index.html";
    }

    function showActions(video) {
        const actions = video.parentElement.querySelector(".actions");
        actions.style.display = "flex";
    }

    function like(btn) {
        alert("Você curtiu o vídeo 👍");
        btn.closest(".card").style.display = "none";
    }

    function dislike(btn) {
        alert("Você não curtiu o vídeo 👎");
        btn.closest(".card").style.display = "none";
    }
</script>

</body>
</html>
