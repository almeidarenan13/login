<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MetaQuest - Home</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #fff;
}

/* TOPO */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
}

/* LOGO */
.logo {
    background: #5b74ff;
    color: #fff;
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: bold;
}

/* SALDO + BARRA */
.right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.progress {
    width: 120px;
    height: 8px;
    background: #dcdcdc;
    border-radius: 10px;
    overflow: hidden;
}

.progress span {
    display: block;
    width: 45%;
    height: 100%;
    background: linear-gradient(90deg, #001aff, #00aaff);
}

.balance {
    background: #001aff;
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: bold;
}

/* CONTEÚDO */
.container {
    padding: 25px 20px;
}

.box {
    width: 100%;
    height: 170px;
    border: 2px solid #222;
    border-radius: 22px;
    margin-bottom: 30px;
}
</style>
</head>

<body>

<!-- TOPO -->
<div class="topbar">
    <div class="logo">META</div>

    <div class="right">
        <div class="progress">
            <span></span>
        </div>
        <div class="balance">💰 $0</div>
    </div>
</div>

<!-- CAIXAS -->
<div class="container">
    <div class="box"></div>
    <div class="box"></div>
</div>

</body>
</html>
