<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meta — Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar spaced">
    <div class="left">
      <div class="logo">META</div>
    </div>

    <div class="right">
      <div class="status" aria-hidden="true">
        <div class="progress-wrap" title="Progresso">
          <div class="progress-track"></div>
          <div class="progress-fill" style="width:45%"></div>
        </div>
        <div class="coin">$ 0</div>
      </div>

      <a href="index.html" class="btn ghost">Voltar</a>
    </div>
  </header>

  <main class="page target-page">
    <div class="cards-wrapper">
      <div class="big-card" role="region" aria-label="Cartão 1"></div>
      <div class="big-card" role="region" aria-label="Cartão 2"></div>
    </div>
  </main>
</body>
</html>
