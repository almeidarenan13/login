<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meta — Home</title>
  <style>
    :root{--blue:#4B8BF5;--muted:#777}
    *{box-sizing:border-box} html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111}
    .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #f0f0f0}
    .logo{background:var(--blue);color:#fff;padding:8px 14px;border-radius:20px;font-weight:700}
    .preview{max-width:520px;margin:40px auto;text-align:center}
    .preview .small-card{height:80px;border-radius:18px;border:2px dashed #e6e6e6;display:flex;align-items:center;justify-content:center;color:#bbb;margin:12px 0}
    .btn{padding:8px 14px;border-radius:8px;border:0;cursor:pointer;background:#007bff;color:#fff;font-weight:600}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">META</div>
    <div style="display:flex;gap:12px;align-items:center">
      <div style="background:#eaf1ff;padding:6px 10px;border-radius:12px">Progresso</div>
      <div style="background:#003f8a;color:#fff;padding:6px 10px;border-radius:8px">$ 0</div>
      <button id="loginBtn" class="btn">Login</button>
    </div>
  </header>

  <main>
    <section class="preview">
      <h2>Bem-vindo</h2>
      <p>Clique em Login para ir à tela de cartões.</p>
      <div class="small-card">Preview 1</div>
      <div class="small-card">Preview 2</div>
    </section>
  </main>

  <script>
    // Aqui fazemos um redirecionamento explícito para dashboard.html
    document.getElementById('loginBtn').addEventListener('click', function(){
      // Se preferir manter em mesmo arquivo, use navigation in-page. Aqui vamos abrir outra página:
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
