<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login | MetaQuest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 320px;
            padding: 25px;
            border: 2px solid #ddd;
            border-radius: 18px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b5cff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .msg {
            margin-top: 12px;
            font-size: 14px;
            color: red;
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- LOGO -->
    <img src="logo.png" alt="MetaQuest" class="logo">

    <!-- INPUTS -->
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">

    <!-- BOTÃO -->
    <button onclick="login()">Login</button>

    <!-- MENSAGEM -->
    <div class="msg" id="msg"></div>
</div>

<script>
    // LOGIN PADRÃO
    const EMAIL_PADRAO = "admin@metaquest.com";
    const SENHA_PADRAO = "123456";

    function login() {
        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;
        const msg = document.getElementById("msg");

        if (email === "" || senha === "") {
            msg.innerText = "Preencha todos os campos.";
            return;
        }

        if (email === EMAIL_PADRAO && senha === SENHA_PADRAO) {
            window.location.href = "home.html";
        } else {
            msg.innerText = "E-mail ou senha incorretos.";
        }
    }
</script>

</body>
</html>
